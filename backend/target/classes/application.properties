spring.application.name=aionos-agent
server.port=8080

# H2 Database Configuration (Easy local setup for demo & evaluation)
spring.datasource.url=jdbc:h2:mem:aionosdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# H2 Console Configuration (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.com.aionos.agent=INFO
logging.level.org.springframework.web=INFO

# AI Configuration (Optional - runs in full DEMO mode by default)
aionos.ai.enabled=false
aionos.ai.provider=demo
aionos.ai.api-key=
